name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:src/version.js | grep -oP "APP_VERSION = '\K[^']+")
          PR_VERSION=$(grep -oP "APP_VERSION = '\K[^']+" src/version.js)
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "❌ Version was not bumped (still $PR_VERSION)."
            echo "   Run: pwsh scripts/bump-version.ps1 <new-version>"
            exit 1
          fi
          echo "✅ Version bumped: $BASE_VERSION → $PR_VERSION"
